<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DOS Runner</title>
    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #dos-canvas {
            width: 100% !important;
            height: 100% !important;
            display: block;
            background: transparent;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            outline: none;
        }
    </style>
</head>

<body>
    <canvas id="dos-canvas" tabindex="0"></canvas>

    <!-- Mobile Keyboard Helper -->
    <input type="text" id="mobile-keyboard-helper"
        style="position: absolute; opacity: 0; top: -1000px; left: -1000px; border: none; outline: none; background: transparent; color: transparent; width: 1px; height: 1px;"
        autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />

    <script>
        // ==================== CONSOLE FILTER ====================
        // Must run first, before js-dos loads, to suppress all noisy output.
        (function () {
            const originalLog = console.log;
            const originalInfo = console.info;
            const originalWarn = console.warn;

            const shouldBlock = (msg) => {
                if (typeof msg !== 'string') return false;
                if (msg.includes('extracting:')) return true;
                if (msg.includes('mtime:')) return true;
                if (msg.includes('js-dos version')) return true;
                if (msg.includes('Copyright') && msg.includes('DOSBox')) return true;
                if (msg.startsWith('CONFIG:')) return true;
                if (msg.startsWith('MIDI:')) return true;
                if (msg.startsWith('SHELL:')) return true;
                if (msg.includes('%') && msg.match(/[a-f0-9-]{36}/)) return true;
                if (msg.startsWith('[INFO]') && msg.match(/[a-f0-9-]{36}/)) return true;
                if (msg.includes('Resolving DosBox')) return true;
                if (msg.includes('DosBox resolved')) return true;
                if (msg.includes('Runtime is still alive')) return true;
                if (msg.trim() === '---') return true;
                return false;
            };

            console.log = function (...args) {
                if (args.length > 0 && shouldBlock(args[0])) return;
                originalLog.apply(console, args);
            };

            console.info = function (...args) {
                if (args.length > 0 && shouldBlock(args[0])) return;
                originalInfo.apply(console, args);
            };

            // js-dos sometimes routes noisy messages through warn too
            console.warn = function (...args) {
                if (args.length > 0 && shouldBlock(args[0])) return;
                originalWarn.apply(console, args);
            };
        })();

        // ==================== DOS RUNNER ====================
        (function () {
            // NOTE: parentOrigin assumes dos-runner.html is served from the same
            // origin as the parent page. If you ever move this file to a CDN or
            // subdomain, postMessage will silently fail — update this accordingly.
            const canvas = document.getElementById('dos-canvas');
            const mobileHelper = document.getElementById('mobile-keyboard-helper');
            const parentOrigin = window.location.origin;

            // --- Mobile Keyboard Forwarding ---
            const cloneKeyEvent = (type, e) => {
                const event = new KeyboardEvent(type, {
                    key: e.key,
                    code: e.code,
                    keyCode: e.keyCode,
                    which: e.which,
                    shiftKey: e.shiftKey,
                    ctrlKey: e.ctrlKey,
                    altKey: e.altKey,
                    metaKey: e.metaKey,
                    bubbles: true,
                    cancelable: true
                });
                canvas.dispatchEvent(event);
            };

            let lastKeyCode = 0;

            mobileHelper.addEventListener('keydown', (e) => {
                lastKeyCode = e.keyCode;
                // If it's a Backspace, keep the value populated so mobile browsers keep sending delete events
                if (e.key === 'Backspace' && mobileHelper.value.length === 0) {
                    mobileHelper.value = ' ';
                }
                // Do not clone if it's the virtual keyboard proxy code (229)
                if (e.keyCode !== 229) {
                    cloneKeyEvent('keydown', e);
                }
            });

            mobileHelper.addEventListener('keyup', (e) => {
                if (e.keyCode !== 229) {
                    cloneKeyEvent('keyup', e);
                }
            });

            mobileHelper.addEventListener('keypress', (e) => {
                if (e.keyCode !== 229) {
                    cloneKeyEvent('keypress', e);
                }
            });

            mobileHelper.addEventListener('input', (e) => {
                // Determine if we need to synthesize key events from the 'input' event
                if (lastKeyCode === 229) {
                    if (e.inputType === 'insertText' && e.data) {
                        for (let i = 0; i < e.data.length; i++) {
                            const char = e.data[i];
                            const charCode = char.charCodeAt(0);
                            const isUpper = char === char.toUpperCase() && char !== char.toLowerCase();
                            const baseCode = char.toUpperCase().charCodeAt(0);

                            const eventData = {
                                key: char,
                                code: 'Key' + char.toUpperCase(),
                                keyCode: baseCode,
                                which: baseCode,
                                charCode: charCode,
                                shiftKey: isUpper,
                                bubbles: true,
                                cancelable: true
                            };

                            canvas.dispatchEvent(new KeyboardEvent('keydown', eventData));
                            canvas.dispatchEvent(new KeyboardEvent('keypress', eventData));
                            canvas.dispatchEvent(new KeyboardEvent('keyup', eventData));
                        }
                    } else if (e.inputType === 'deleteContentBackward') {
                        const eventData = {
                            key: 'Backspace',
                            code: 'Backspace',
                            keyCode: 8,
                            which: 8,
                            bubbles: true,
                            cancelable: true
                        };
                        canvas.dispatchEvent(new KeyboardEvent('keydown', eventData));
                        canvas.dispatchEvent(new KeyboardEvent('keyup', eventData));
                    }
                }

                // Ensure there's always something to backspace for mobile keyboards
                if (mobileHelper.value.length === 0) {
                    mobileHelper.value = ' ';
                }
            });

            // Focus helper when canvas is clicked/touched
            canvas.addEventListener('click', () => {
                mobileHelper.focus();
            });
            canvas.addEventListener('touchend', () => {
                mobileHelper.focus();
            }, { passive: true });
            // ----------------------------------

            // Hint to browser that this canvas will be read frequently (suppresses warning)
            try {
                canvas.getContext('2d', { willReadFrequently: true });
            } catch (e) {
                // Non-critical, ignore if it fails
            }

            let jsdosReady = false;
            let dosInstance = null;
            let errorPollTimer = null;
            let errorPollDelayTimer = null;
            let startupTimeoutTimer = null;
            let lastErrorContent = '';
            let compileErrorSent = false;

            // ==================== MESSAGING ====================
            function post(message) {
                window.parent.postMessage(message, parentOrigin);
            }

            // ==================== STATE CLEANUP ====================
            function clearRuntimeState() {
                if (errorPollDelayTimer) {
                    clearTimeout(errorPollDelayTimer);
                    errorPollDelayTimer = null;
                }
                if (errorPollTimer) {
                    clearInterval(errorPollTimer);
                    errorPollTimer = null;
                }
                if (startupTimeoutTimer) {
                    clearTimeout(startupTimeoutTimer);
                    startupTimeoutTimer = null;
                }
                lastErrorContent = '';
                compileErrorSent = false;
            }

            async function stopDos() {
                clearRuntimeState();
                if (dosInstance && typeof dosInstance.exit === 'function') {
                    try {
                        dosInstance.exit();
                    } catch (e) {
                        // Ignore shutdown errors — DOSBox cleanup is best-effort
                    }
                }
                dosInstance = null;
            }

            // ==================== SCRIPT LOADING ====================
            function loadScript(src) {
                return new Promise((resolve, reject) => {
                    const script = document.createElement('script');
                    script.src = src;
                    script.onload = resolve;
                    script.onerror = () => reject(new Error('Failed to load: ' + src));
                    document.head.appendChild(script);
                });
            }

            async function ensureJsdos() {
                if (jsdosReady && typeof Dos !== 'undefined') return;
                if (typeof Dos === 'undefined') {
                    await loadScript('/compiler-assets/libs/js-dos.js');
                }
                jsdosReady = true;
            }

            // ==================== FILESYSTEM HELPERS ====================
            function fileExists(fs, path) {
                try {
                    fs.stat(path);
                    return true;
                } catch (e) {
                    return false;
                }
            }

            function firstExistingPath(fs, paths) {
                for (const path of paths) {
                    if (fileExists(fs, path)) return path;
                }
                return null;
            }

            function readTextFile(fs, path) {
                try {
                    return fs.readFile(path, { encoding: 'utf8' }) || '';
                } catch (e) {
                    try {
                        const bytes = fs.readFile(path);
                        return new TextDecoder().decode(bytes) || '';
                    } catch (e2) {
                        return '';
                    }
                }
            }

            // ==================== ERROR POLLING ====================
            function startErrorPolling() {
                clearRuntimeState();

                // Delay polling start to let compilation begin
                errorPollDelayTimer = setTimeout(() => {
                    const probe = () => {
                        try {
                            if (!dosInstance || !dosInstance.em || !dosInstance.em.FS) return;
                            const FS = dosInstance.em.FS;

                            const errPath = firstExistingPath(FS, [
                                '/TURBOC3/BIN/ERR.TXT',
                                'TURBOC3/BIN/ERR.TXT',
                                '/ERR.TXT',
                                'ERR.TXT',
                                '/home/web_user/ERR.TXT',
                                'home/web_user/ERR.TXT',
                                '/turboc3/bin/err.txt',
                                'turboc3/bin/err.txt'
                            ]);
                            const failPath = firstExistingPath(FS, [
                                '/TURBOC3/BIN/FAIL.TXT',
                                'TURBOC3/BIN/FAIL.TXT',
                                '/FAIL.TXT',
                                'FAIL.TXT',
                                '/home/web_user/FAIL.TXT',
                                'home/web_user/FAIL.TXT',
                                '/turboc3/bin/fail.txt',
                                'turboc3/bin/fail.txt'
                            ]);
                            const userExePath = firstExistingPath(FS, [
                                '/TURBOC3/BIN/USER.EXE',
                                'TURBOC3/BIN/USER.EXE',
                                '/USER.EXE',
                                'USER.EXE',
                                '/turboc3/bin/user.exe',
                                'turboc3/bin/user.exe'
                            ]);

                            const hasFailMarker = !!failPath;
                            const hasUserExe = !!userExePath;

                            // Compilation succeeded — stop polling, nothing more to do
                            if (hasUserExe && !hasFailMarker) {
                                clearInterval(errorPollTimer);
                                errorPollTimer = null;
                                return;
                            }

                            const content = errPath ? readTextFile(FS, errPath) : '';
                            const trimmed = content.trim();

                            if (!hasFailMarker && !trimmed) return;
                            if (content === lastErrorContent && !hasFailMarker) return;
                            lastErrorContent = content;

                            const lower = trimmed.toLowerCase();
                            const looksLikeError =
                                hasFailMarker ||
                                /(^|\b)(error|fatal|undefined|unable|unresolved|not found)(\b|:)/i.test(trimmed) ||
                                (!hasUserExe && lower.length > 0);

                            if (looksLikeError && !compileErrorSent) {
                                compileErrorSent = true;
                                // Stop polling once error is confirmed and sent
                                clearInterval(errorPollTimer);
                                errorPollTimer = null;
                                post({
                                    type: 'COMPILATION_ERROR',
                                    content: trimmed || 'Compilation failed. Check your code and try again.'
                                });
                            }
                        } catch (e) {
                            // Ignore polling errors silently
                        }
                    };

                    probe();
                    errorPollTimer = setInterval(probe, 400);
                }, 1500);
            }

            // ==================== DOS STARTUP ====================
            async function startDos(payload) {
                await stopDos();
                await ensureJsdos();

                // Safety timeout: if DOS hasn't started within 60s, report failure.
                // This handles corrupted ZIPs, network stalls mid-extract, or
                // Emscripten hangs that would otherwise freeze the UI permanently.
                startupTimeoutTimer = setTimeout(() => {
                    startupTimeoutTimer = null;
                    if (!dosInstance) {
                        post({
                            type: 'ERROR',
                            message: 'Compiler took too long to start. Please refresh and try again.'
                        });
                    }
                }, 60000);

                post({ type: 'STATUS', status: 'STARTING' });

                const runner = Dos(canvas, {
                    wdosboxUrl: payload.wdosboxUrl,
                    cycles: payload.cycles || 'max',
                    autolock: false
                });

                await runner.ready(async (fs, main) => {
                    post({ type: 'STATUS', status: 'EXTRACTING' });
                    await fs.extract(payload.zipUrl);

                    post({ type: 'STATUS', status: 'WRITING_CODE' });

                    // Write source files — if this fails, report immediately
                    // rather than letting DOSBox silently compile an empty file
                    try {
                        fs.createFile('TURBOC3/BIN/USER.CPP', payload.code || '');
                        fs.createFile('AUTOEXEC.BAT', payload.batchScript || '');
                    } catch (e) {
                        post({
                            type: 'ERROR',
                            message: 'Failed to write source file to DOS filesystem: ' + e.message
                        });
                        return;
                    }

                    dosInstance = await main(['-conf', 'dosbox.conf', 'AUTOEXEC.BAT']);

                    // Clear startup timeout — DOS is now running
                    if (startupTimeoutTimer) {
                        clearTimeout(startupTimeoutTimer);
                        startupTimeoutTimer = null;
                    }

                    startErrorPolling();
                    post({ type: 'STATUS', status: 'RUNNING' });
                });
            }

            // ==================== MESSAGE HANDLER ====================
            window.addEventListener('message', async (event) => {
                if (event.origin !== parentOrigin) return;
                const data = event.data || {};

                if (data.type === 'FOCUS') {
                    canvas.focus();
                    try {
                        mobileHelper.focus();
                    } catch (e) { }
                    return;
                }

                // Release keyboard capture when user switches back to editor
                if (data.type === 'BLUR') {
                    canvas.blur();
                    try {
                        mobileHelper.blur();
                    } catch (e) { }
                    return;
                }

                if (data.type === 'STOP_DOS') {
                    await stopDos();
                    return;
                }

                if (data.type === 'INIT_DOS') {
                    try {
                        await startDos(data.payload || {});
                    } catch (e) {
                        post({ type: 'ERROR', message: e.message || 'Failed to start DOS' });
                    }
                }

                if (data.type === 'TAKE_SCREENSHOT') {
                    const purpose = data.purpose || 'download';
                    const requestId = data.requestId || null;

                    try {
                        if (typeof canvas.toBlob === 'function') {
                            canvas.toBlob((blob) => {
                                if (!blob) {
                                    try {
                                        const dataUrl = canvas.toDataURL('image/png');
                                        post({ type: 'SCREENSHOT_DATA', dataUrl, purpose, requestId });
                                    } catch (fallbackErr) {
                                        post({ type: 'SCREENSHOT_DATA', error: 'capture_failed', purpose, requestId });
                                    }
                                    return;
                                }

                                post({
                                    type: 'SCREENSHOT_DATA',
                                    blob: blob,
                                    mimeType: blob.type || 'image/png',
                                    purpose: purpose,
                                    requestId: requestId
                                });
                            }, 'image/png');
                        } else {
                            const dataUrl = canvas.toDataURL('image/png');
                            post({ type: 'SCREENSHOT_DATA', dataUrl, purpose, requestId });
                        }
                    } catch (e) {
                        post({ type: 'SCREENSHOT_DATA', error: 'capture_failed', purpose, requestId });
                    }
                }
            });

            // Signal to parent that iframe is ready to receive messages
            post({ type: 'IFRAME_READY' });
        })();
    </script>
</body>

</html>
