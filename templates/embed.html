<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embed - Graphics.h</title>
    <style>
        :root {
            --embed-width: 640px;
            --embed-height: 480px;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: "IBM Plex Sans", sans-serif;
        }

        body {
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
        }

        #embed-viewport {
            position: relative;
            width: var(--embed-width);
            height: var(--embed-height);
            background: #000;
            overflow: hidden;
            user-select: none;
        }

        #dos-iframe {
            display: block;
            border: 0;
            width: 640px;
            height: 480px;
            background: #000;
        }

        #loading {
            position: absolute;
            inset: 0;
            background: #000;
            color: #a9b1d6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .hidden {
            display: none !important;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #24283b;
            border-top-color: #7aa2f7;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
    <!-- Load resources (wdosbox, zip) nicely like compiler does -->
    <script src="/static/resource-loader.js"></script>
</head>

<body>
    <div id="embed-viewport">
        <div id="loading" class="hidden">
            <div class="spinner"></div>
            <div id="loading-text">Starting DOS...</div>
        </div>
        <iframe id="dos-iframe" src="/static/dos-runner.html" tabindex="-1"></iframe>
    </div>

    <script>
        const BASE_WIDTH = 640;
        const BASE_HEIGHT = 480;
        const iframe = document.getElementById('dos-iframe');
        const viewport = document.getElementById('embed-viewport');
        const loading = document.getElementById('loading');
        const loadingText = document.getElementById('loading-text');

        let wdosboxUrl = '';
        let tcZipSources = [];
        let iframeReady = false;
        let pendingRun = null; // { snippet, boilerplate, focus }
        let trustedParentOrigin = null;
        let currentZipObjUrl = null;

        async function init() {
            await ResourceLoader.init();
            wdosboxUrl = await ResourceLoader.getResourceUrl('libs', 'wdosbox');
            const tcZipConfig = await ResourceLoader.getAllUrls('assets', 'tc-zip');
            tcZipSources = [];

            if (!ResourceLoader.isOffline()) {
                tcZipSources = tcZipSources.concat(tcZipConfig.urls || []);
            }
            if (tcZipConfig.localPath) {
                tcZipSources.push(tcZipConfig.localPath);
            }
        }

        // Standard batch script to compile and run silent
        const batchScript = `@ECHO OFF
CD TURBOC3\\BIN
IF EXIST USER.EXE DEL USER.EXE
IF EXIST ERR.TXT DEL ERR.TXT
IF EXIST FAIL.TXT DEL FAIL.TXT
TCC -I..\\INCLUDE -L..\\LIB -n. USER.CPP ..\\LIB\\GRAPHICS.LIB > ERR.TXT
IF EXIST USER.EXE GOTO SUCCESS
ECHO COMPILE_FAILED > FAIL.TXT
COPY ERR.TXT C:\\ERR.TXT >NUL
COPY FAIL.TXT C:\\FAIL.TXT >NUL
CLS
ECHO ========================================
ECHO COMPILATION ERRORS:
ECHO ========================================
TYPE ERR.TXT
ECHO.
PAUSE
EXIT
:SUCCESS
CLS
USER.EXE
PAUSE
`;

        function normalizeScale(scale) {
            const parsed = Number.parseFloat(scale);
            if (!Number.isFinite(parsed) || parsed <= 0) return 1;
            return parsed;
        }

        function setEmbedScale(scale) {
            const s = normalizeScale(scale);
            viewport.style.width = `${Math.round(BASE_WIDTH * s)}px`;
            viewport.style.height = `${Math.round(BASE_HEIGHT * s)}px`;
            iframe.style.transform = `scale(${s})`;
            iframe.style.transformOrigin = 'top left';
        }

        function buildProgramCode(snippet, useBoilerplate) {
            if (!useBoilerplate) return snippet;
            return `#include <graphics.h>
#include <conio.h>

int main() {
    int gd = DETECT, gm;
    initgraph(&gd, &gm, "");

    ${snippet}

    getch();
    closegraph();
    return 0;
}`;
        }

        async function runSnippet(snippet, useBoilerplate = true, focus = false) {
            loading.classList.remove('hidden');
            loadingText.textContent = "Loading compiler...";

            try {
                let blob = null;
                let downloadError = null;
                for (const zipUrl of tcZipSources) {
                    try {
                        const response = await fetch(zipUrl);
                        if (!response.ok) throw new Error("Failed to download compiler");
                        blob = await response.blob();
                        break;
                    } catch (err) {
                        downloadError = err;
                    }
                }
                if (!blob) {
                    throw downloadError || new Error("Failed to download compiler");
                }
                if (currentZipObjUrl) URL.revokeObjectURL(currentZipObjUrl);
                currentZipObjUrl = URL.createObjectURL(blob);

                const fullCode = buildProgramCode(snippet, useBoilerplate);

                iframe.contentWindow.postMessage({ type: 'STOP_DOS' }, window.location.origin);

                setTimeout(() => {
                    iframe.contentWindow.postMessage({
                        type: 'INIT_DOS',
                        payload: {
                            wdosboxUrl: wdosboxUrl,
                            zipUrl: currentZipObjUrl,
                            code: fullCode,
                            batchScript: batchScript,
                            cycles: 'max'
                        }
                    }, window.location.origin);
                    if (focus) {
                        iframe.contentWindow.postMessage({ type: 'FOCUS' }, window.location.origin);
                    }
                }, 150);
            } catch (err) {
                loadingText.textContent = "Failed to load compiler";
                console.error(err);
            }
        }

        function isTrustedParentEvent(event) {
            // Allow embedding from any website, but only trust the direct parent frame.
            if (window.parent === window) return false;
            if (event.source !== window.parent) return false;
            trustedParentOrigin = event.origin || trustedParentOrigin;
            return true;
        }

        window.addEventListener('message', (e) => {
            if (e.data && e.data.type === 'RUN_SNIPPET' && isTrustedParentEvent(e)) {
                const snippet = e.data.snippet || '';
                const boilerplate = e.data.boilerplate !== false;
                const focus = e.data.focus !== false;

                if (!iframeReady || !wdosboxUrl) {
                    pendingRun = { snippet, boilerplate, focus };
                } else {
                    runSnippet(snippet, boilerplate, focus);
                }
            }

            if (e.source === iframe.contentWindow) {
                const data = e.data || {};

                if (data.type === 'IFRAME_READY') {
                    iframeReady = true;
                    if (window.parent !== window) {
                        window.parent.postMessage({ type: 'EMBED_READY' }, trustedParentOrigin || '*');
                    }
                    if (pendingRun && wdosboxUrl) {
                        runSnippet(pendingRun.snippet, pendingRun.boilerplate, pendingRun.focus);
                        pendingRun = null;
                    }
                }
                else if (data.type === 'STATUS') {
                    if (data.status === 'RUNNING') {
                        loading.classList.add('hidden');
                    } else if (data.status === 'STARTING') {
                        loadingText.textContent = 'Initializing DOS...';
                    } else if (data.status === 'EXTRACTING') {
                        loadingText.textContent = 'Extracting compiler files...';
                    } else if (data.status === 'WRITING_CODE') {
                        loadingText.textContent = 'Compiling...';
                    }
                }
                else if (data.type === 'COMPILATION_ERROR') {
                    loadingText.textContent = 'Compilation Error';
                    console.error("Compilation error in embed:", data.content);
                    loading.classList.add('hidden');
                }
            }
        });

        init().then(() => {
            const urlParams = new URLSearchParams(window.location.search);
            const urlCode = urlParams.get('code');
            const boilerplate = urlParams.get('boilerplate') !== 'false';
            const scale = urlParams.get('scale');

            if (scale) {
                setEmbedScale(scale);
            } else {
                setEmbedScale(1);
            }

            if (urlCode) {
                if (!iframeReady || !wdosboxUrl) {
                    pendingRun = { snippet: urlCode, boilerplate, focus: false };
                } else {
                    runSnippet(urlCode, boilerplate, false);
                }
            } else if (iframeReady && pendingRun) {
                runSnippet(pendingRun.snippet, pendingRun.boilerplate, pendingRun.focus);
                pendingRun = null;
            }
        });
    </script>
</body>

</html>
