        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0a0a0a;
            --surface: #111111;
            --surface-low: #0d0d0d;
            --surface-high: #1a1a1a;
            --accent: #00ff88;
            --accent-glow: rgba(0, 255, 136, 0.12);
            --border: #1f1f1f;
            --text-main: #f0f0f0;
            --text-dim: #999999;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --header-h: 64px;
        }

        html,
        body {
            height: 100%;
            background: var(--bg);
            color: var(--text-main);
            font-family: 'IBM Plex Sans', -apple-system, sans-serif;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* ==================== HEADER ==================== */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            background: rgba(10, 10, 10, 0.85);
            border-bottom: 1px solid var(--border);
            height: var(--header-h);
        }

        .header-content {
            height: 100%;
            display: grid;
            grid-template-columns: 280px 1fr 280px;
            align-items: center;
            padding: 0 1.5rem;
        }

        .header-left {
            display: flex;
            justify-content: flex-start;
        }

        .header-center {
            display: flex;
            justify-content: center;
        }

        .header-right {
            display: flex;
            justify-content: flex-end;
        }

        .header-title {
            font-family: 'Space Mono', monospace;
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .header-title .bracket {
            color: var(--accent);
        }

        .btn-nav {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #fff;
            font-size: 0.85rem;
            font-weight: 500;
            text-decoration: none;
            transition: var(--transition);
        }

        .btn-nav:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }

        .btn-nav i {
            width: 16px;
            height: 16px;
        }

        .btn-compiler {
            background: var(--accent);
            color: var(--bg-dark);
            font-weight: 700;
            border-color: var(--accent);
        }

        .btn-compiler:hover {
            background: #00ff9d;
            border-color: #00ff9d;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        /* ==================== LAYOUT ==================== */
        .docs-layout {
            display: flex;
            height: calc(100vh - 64px);
            margin-top: 64px;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: var(--surface-low);
            border-right: 1px solid var(--border);
            overflow-y: auto;
            flex-shrink: 0;
            padding-bottom: 2rem;
        }

        .sidebar::-webkit-scrollbar {
            width: 4px;
        }

        .sidebar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.05);
        }

        .sidebar-search-container {
            padding: 1.5rem 1.25rem 1rem;
            position: sticky;
            top: 0;
            background: var(--surface-low);
            z-index: 10;
        }

        .search-field {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            padding: 0.65rem 0.8rem;
            border-radius: 8px;
            color: #fff;
            font-size: 0.85rem;
            outline: none;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            transition: var(--transition);
        }

        .search-field:focus-within {
            border-color: var(--accent);
            background: rgba(0, 255, 136, 0.05);
        }

        .search-field input {
            background: transparent;
            border: none;
            color: inherit;
            outline: none;
            width: 100%;
        }

        .nav-group {
            margin-top: 1.5rem;
        }

        .nav-group-header {
            padding: 1.25rem 1.25rem 0.5rem;
            font-size: 0.75rem;
            font-weight: 800;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-group-header::before {
            content: '';
            width: 12px;
            height: 2px;
            background: var(--accent);
            opacity: 0.5;
        }

        .nav-link {
            display: flex;
            align-items: center;
            padding: 0.45rem 1.25rem;
            color: #aaa;
            text-decoration: none;
            font-size: 0.85rem;
            transition: var(--transition);
            border-left: 2px solid transparent;
        }

        .nav-link:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.03);
        }

        .nav-link.active {
            color: var(--accent);
            background: rgba(0, 255, 136, 0.05);
            border-left-color: var(--accent);
            font-weight: 500;
        }

        .main-content {
            flex-grow: 1;
            background: var(--bg);
            overflow-y: auto;
            padding: 4rem 3rem 6rem;
            scroll-behavior: smooth;
        }

        .content-inner {
            max-width: 860px;
            margin: 0 auto;
        }

        /* Documentation Component Styling */
        .doc-section {
            margin-bottom: 4rem;
        }

        .doc-header {
            margin-bottom: 3.5rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 2rem;
        }

        .doc-title {
            font-size: clamp(2rem, 5vw, 3.2rem);
            font-weight: 800;
            letter-spacing: -0.05em;
            margin-bottom: 0.75rem;
            color: #fff;
            line-height: 1.1;
        }

        .doc-subtitle {
            font-size: 1.1rem;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .doc-meta {
            display: flex;
            gap: 1.5rem;
            margin-top: 1.5rem;
            font-family: 'Space Mono', monospace;
            font-size: 0.8rem;
            color: var(--accent);
        }

        .doc-meta-item {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        h2.section-heading {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            margin-top: 3.5rem;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        h2.section-heading::before {
            content: '';
            width: 4px;
            height: 24px;
            background: var(--accent);
            border-radius: 2px;
        }

        .doc-paragraph {
            font-size: 1.05rem;
            line-height: 1.8;
            color: #bbb;
            margin-bottom: 1.5rem;
        }

        /* Code Block Styling */
        .code-block-wrapper {
            margin: 1.5rem 0;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border);
            background: #0d1117;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .code-header {
            background: rgba(255, 255, 255, 0.02);
            padding: 0.6rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }

        .code-lang {
            font-family: 'Space Mono', monospace;
            font-size: 0.68rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .copy-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-dim);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.7rem;
            padding: 0.25rem 0.6rem;
            border-radius: 6px;
        }

        .copy-btn:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--accent);
        }

        .copy-btn.copied {
            color: var(--accent);
        }

        pre {
            margin: 0;
            padding: 1.25rem !important;
            font-family: 'JetBrains Mono', monospace !important;
            font-size: 0.84rem !important;
            overflow-x: auto;
            line-height: 1.65 !important;
            background: #0d1117 !important;
        }

        pre code {
            background: transparent !important;
            padding: 0 !important;
        }

        .param-list {
            list-style: none;
        }

        .param-item {
            padding: 1rem;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 8px;
            margin-bottom: 0.75rem;
            border: 1px solid var(--border);
        }

        .param-name {
            font-family: 'Space Mono', monospace;
            color: var(--accent);
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .param-desc {
            font-size: 0.95rem;
            color: #999;
        }

        /* Live Preview Container */
        .live-preview-container {
            background: var(--surface-low);
            border: 1px solid var(--border);
            border-radius: 12px;
            margin: 1.5rem 0;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .live-preview-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 1rem;
            background: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid var(--border);
        }

        .live-preview-title {
            font-family: 'Space Mono', monospace;
            font-size: 0.7rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .sdk-output-container {
            background: #000;
            padding: 1.5rem;
            display: flex;
            justify-content: center;
            min-height: 300px;
        }

        .sdk-placeholder {
            color: var(--text-dim);
            font-family: 'Space Mono', monospace;
            font-size: 0.85rem;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            align-items: center;
            justify-content: center;
        }

        .run-btn {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: var(--transition);
        }

        .run-btn:hover {
            background: #00e87a;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .category-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            padding: 1.5rem;
            border-radius: 16px;
            text-decoration: none;
            color: inherit;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 1.25rem;
        }

        .category-card:hover {
            border-color: var(--accent);
            background: rgba(0, 255, 136, 0.02);
            transform: translateY(-4px);
        }

        .card-icon {
            width: 48px;
            height: 48px;
            background: rgba(0, 255, 136, 0.05);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
            flex-shrink: 0;
        }

        .card-body h3 {
            font-size: 1.1rem;
            color: #fff;
            margin-bottom: 0.25rem;
        }

        .card-body p {
            font-size: 0.85rem;
            color: #888;
            margin: 0;
        }

        /* Animation */
        .fade-in {
            animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 900px) {
            .header-content {
                grid-template-columns: 1fr 1fr;
            }

            .header-center {
                display: none;
            }

            .sidebar {
                display: none;
            }
        }

        /* Pagination */
        .next-page-link {
            display: inline-flex;
            align-items: center;
            gap: 1rem;
            padding: 1.25rem 2rem;
            background: var(--surface-low);
            border: 1px solid var(--border);
            border-radius: 16px;
            text-decoration: none;
            color: #ccc;
            margin-top: 4rem;
            font-size: 0.9rem;
            font-weight: 600;
            transition: var(--transition);
            float: right;
            clear: both;
        }

        .next-page-link:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--surface-high);
            transform: translateX(8px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .next-page-link i {
            width: 14px;
            height: 14px;
        }
    </style>
</head>

        const ghInstances = {};

        function runCode(id, code) {
            const container = document.getElementById(`${id}-sdk-container`);
            const placeholder = document.getElementById(`${id}-placeholder`);

            if (placeholder) placeholder.style.display = 'none';
            if (container) container.style.display = 'block';

            if (!ghInstances[id]) {
                ghInstances[id] = new GraphicsHEmbed(`#${id}-sdk-container`, {
                    baseUrl: window.location.origin,
                    scale: 0.8
                });
            }

            ghInstances[id].runSnippet(code);
        }

        async function copyCode(btn) {
            const wrapper = btn.closest('.code-block-wrapper');
            const codeEl = wrapper.querySelector('pre code') || wrapper.querySelector('pre');
            const text = codeEl.innerText;

            try {
                await navigator.clipboard.writeText(text);
                const originalContent = btn.innerHTML;
                btn.innerHTML = `<i data-lucide="check" style="width: 12px; height: 12px;"></i> Copied`;
                btn.classList.add('copied');
                if (window.lucide) lucide.createIcons();

                setTimeout(() => {
                    btn.innerHTML = originalContent;
                    btn.classList.remove('copied');
                    if (window.lucide) lucide.createIcons();
                }, 2000);
            } catch (err) {
                console.error('Failed to copy: ', err);
            }
        }

        function renderSidebar() {
            const sidebar = document.getElementById('sidebar-nav');
            let html = '';
            for (const key in NAVIGATION) {
                const group = NAVIGATION[key];
                html += `
                    <div class="nav-group">
                        <div class="nav-group-header">${group.title}</div>
                        ${group.links.map(link => `
                            <a href="${link.path}" class="nav-link ${window.location.pathname === link.path ? 'active' : ''}" data-id="${link.id}">
                                ${link.label}
                            </a>
                        `).join('')}
                    </div>
                `;
            }
            sidebar.innerHTML = html;
            if (window.lucide) lucide.createIcons();
        }

        function navigate(path, push = true) {
            if (push) {
                history.pushState({ path }, '', path);
            }

            let pageId = 'intro';
            if (path !== '/docs' && path !== '/docs/' && path !== '/docs.html') {
                const parts = path.split('/');
                pageId = parts[parts.length - 1] || 'intro';
            }

            const contentArea = document.getElementById('content-area');
            const data = CONTENT[pageId] || `
                <div class="fade-in">
                    <div class="doc-header">
                        <h1 class="doc-title">${pageId}()</h1>
                        <p class="doc-subtitle">API reference for the <code>${pageId}</code> function. This documentation is currently being updated.</p>
                    </div>
                    <div class="doc-section">
                        <p class="doc-paragraph">We are populating the details for this function. In the meantime, you can explore other functions in the sidebar or test the function directly in the compiler.</p>
                    </div>
                    <a href="/docs" class="btn-nav" style="width: fit-content;">Back to Introduction</a>
                </div>
            `;

            contentArea.innerHTML = `<div class="content-inner">${data}${renderNextPage(pageId)}</div>`;

            // Apply syntax highlighting
            contentArea.querySelectorAll('pre code').forEach(block => {
                if (window.hljs) hljs.highlightElement(block);
            });

            document.getElementById('main-content').scrollTop = 0;

            // Sync sidebar
            document.querySelectorAll('.nav-link').forEach(el => {
                const href = el.getAttribute('href');
                el.classList.toggle('active', href === path || (path === '/docs' && href === '/docs'));
            });

            if (window.lucide) lucide.createIcons();
        }

        document.addEventListener('click', e => {
            const link = e.target.closest('a');
            const href = link?.getAttribute('href');
            if (link && (href?.startsWith('/docs'))) {
                if (link.target === '_blank' || e.metaKey || e.ctrlKey) return;
                e.preventDefault();
                navigate(link.getAttribute('href'));
            }
        });

        window.addEventListener('popstate', () => {
            navigate(window.location.pathname, false);
        });

        document.getElementById('docs-search').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            document.querySelectorAll('.nav-link').forEach(link => {
                const text = link.textContent.toLowerCase();
                link.style.display = text.includes(query) ? 'flex' : 'none';
            });
            document.querySelectorAll('.nav-group').forEach(group => {
                const visible = group.querySelectorAll('.nav-link:not([style*="display: none"])');
                group.style.display = visible.length > 0 ? 'block' : 'none';
            });
        });

        function renderNextPage(currentId) {
            const allLinks = [];
            for (const group in NAVIGATION) {
                allLinks.push(...NAVIGATION[group].links);
            }

            const currentIndex = allLinks.findIndex(l => l.id === currentId);
            if (currentIndex !== -1 && currentIndex < allLinks.length - 1) {
                const next = allLinks[currentIndex + 1];
                return `
                    <a href="${next.path}" class="next-page-link">
                        ${next.label}
                        <i data-lucide="chevron-right"></i>
                    </a>
                `;
            }
            return '';
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderSidebar();
            navigate(window.location.pathname, false);
        });
    </script>
