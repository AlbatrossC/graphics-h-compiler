        const ghInstances = {};

        function runCode(id, code) {
            const container = document.getElementById(`${id}-sdk-container`);
            const placeholder = document.getElementById(`${id}-placeholder`);

            if (placeholder) placeholder.style.display = 'none';
            if (container) container.style.display = 'block';

            if (!ghInstances[id]) {
                const sdk = new GraphicsHEmbed(`#${id}-sdk-container`, {
                    baseUrl: window.location.origin,
                    scale: 0.8
                });
                ghInstances[id] = sdk;
            }

            ghInstances[id].runSnippet(code);
        }

        async function copyCode(btn) {
            const wrapper = btn.closest('.code-block-wrapper') || btn.closest('.code-well');
            const codeEl = wrapper.querySelector('code');
            const text = codeEl.innerText;

            try {
                await navigator.clipboard.writeText(text);
                const originalContent = btn.innerHTML;
                btn.innerHTML = `<i data-lucide="check" style="width: 14px; height: 14px;"></i> <span>Copied!</span>`;
                btn.classList.add('copied');
                if (window.lucide) lucide.createIcons();

                setTimeout(() => {
                    btn.innerHTML = originalContent;
                    btn.classList.remove('copied');
                    if (window.lucide) lucide.createIcons();
                }, 2000);
            } catch (err) {
                console.error('Failed to copy: ', err);
            }
        }

        function renderSidebar() {
            const sidebar = document.getElementById('sidebar-nav');
            let html = '';
            for (const key in NAVIGATION) {
                const group = NAVIGATION[key];
                html += `
                    <div class="nav-group">
                        <div class="nav-group-header">${group.title}</div>
                        ${group.links.map(link => `
                            <a href="${link.path}" class="nav-link" data-id="${link.id}">
                                ${link.label}
                            </a>
                        `).join('')}
                    </div>
                `;
            }
            sidebar.innerHTML = html;
        }

        function navigate(path, push = true) {
            if (push) history.pushState({ path }, '', path);

            let pageId = 'intro';
            if (path !== '/docs' && path !== '/docs/' && path !== '/docs.html') {
                const parts = path.split('/');
                pageId = parts[parts.length - 1] || 'intro';
            }

            const contentArea = document.getElementById('content-area');
            let data = CONTENT[pageId];

            if (!data) {
                data = `
                    <div class="fade-in">
                        <div class="doc-header">
                            <h1 class="doc-title">${pageId}()</h1>
                            <p class="doc-subtitle">Documentation for this function is coming soon.</p>
                        </div>
                        <div class="doc-section">
                            <p class="doc-paragraph">We are currently updating our API reference. This function will be documented shortly.</p>
                        </div>
                    </div>
                `;
            }

            contentArea.innerHTML = data + renderNextPage(pageId);

            // Highlight
            contentArea.querySelectorAll('pre code').forEach(block => {
                hljs.highlightElement(block);
            });

            // Icons
            if (window.lucide) lucide.createIcons();

            // Sync Sidebar
            document.querySelectorAll('.nav-link').forEach(link => {
                const id = link.getAttribute('data-id');
                link.classList.toggle('active', id === pageId);
            });

            document.getElementById('main-content').scrollTop = 0;
        }

        function renderNextPage(currentId) {
            const allLinks = [];
            for (const group in NAVIGATION) {
                allLinks.push(...NAVIGATION[group].links);
            }

            const currentIndex = allLinks.findIndex(l => l.id === currentId);
            if (currentIndex !== -1 && currentIndex < allLinks.length - 1) {
                const next = allLinks[currentIndex + 1];
                return `
                    <a href="${next.path}" class="next-page-link">
                        <span>Next: <strong>${next.label}</strong></span>
                        <i data-lucide="chevron-right"></i>
                    </a>
                `;
            }
            return '';
        }

        window.addEventListener('popstate', () => navigate(window.location.pathname, false));

        document.addEventListener('click', e => {
            const link = e.target.closest('a');
            if (link && link.getAttribute('href')?.startsWith('/docs')) {
                if (link.target === '_blank' || e.metaKey || e.ctrlKey) return;
                e.preventDefault();
                navigate(link.getAttribute('href'));
            }
        });

        document.getElementById('docs-search').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            document.querySelectorAll('.nav-link').forEach(link => {
                const text = link.textContent.toLowerCase();
                link.style.display = text.includes(query) ? 'flex' : 'none';
            });
            document.querySelectorAll('.nav-group').forEach(group => {
                const visible = group.querySelectorAll('.nav-link:not([style*="display: none"])');
                group.style.display = visible.length > 0 ? 'block' : 'none';
            });
        });

        document.addEventListener('DOMContentLoaded', () => {
            renderSidebar();
            navigate(window.location.pathname, false);
            if (window.lucide) lucide.createIcons();
        });
    </script>
