                    { id: 'setbkcolor', path: '/docs/setbkcolor', label: 'setbkcolor()' },
                    { id: 'setfillstyle', path: '/docs/setfillstyle', label: 'setfillstyle()' },
                    { id: 'setlinestyle', path: '/docs/setlinestyle', label: 'setlinestyle()' },
                    { id: 'floodfill', path: '/docs/floodfill', label: 'floodfill()' }
                ]
            },

                links: [
                    { id: 'getmaxx', path: '/docs/getmaxx', label: 'getmaxx()' },
                    { id: 'getmaxy', path: '/docs/getmaxy', label: 'getmaxy()' },
                    { id: 'getpixel', path: '/docs/getpixel', label: 'getpixel()' },
                    { id: 'imagesize', path: '/docs/imagesize', label: 'imagesize()' },
                    { id: 'getimage', path: '/docs/getimage', label: 'getimage()' },
                    { id: 'putimage', path: '/docs/putimage', label: 'putimage()' }
                ]
            }
        };

        const ghInstances = {};

        function runCode(id, code) {
            const container = document.getElementById(`${id}-sdk-container`);
            const placeholder = document.getElementById(`${id}-placeholder`);

            if (placeholder) placeholder.style.display = 'none';
            if (container) container.style.display = 'block';

            if (!ghInstances[id]) {
                ghInstances[id] = new GraphicsHEmbed(`#${id}-sdk-container`, {
                    baseUrl: window.location.origin,
                    scale: 0.8
                });
            }

            ghInstances[id].runSnippet(code);
        }

        async function copyCode(btn) {
            const wrapper = btn.closest('.code-block-wrapper');
            const codeEl = wrapper.querySelector('pre code') || wrapper.querySelector('pre');
            const text = codeEl.innerText;

            try {
                await navigator.clipboard.writeText(text);
                const originalContent = btn.innerHTML;
                btn.innerHTML = `<i data-lucide="check" style="width: 12px; height: 12px;"></i> Copied`;
                btn.classList.add('copied');
                if (window.lucide) lucide.createIcons();

                setTimeout(() => {
                    btn.innerHTML = originalContent;
                    btn.classList.remove('copied');
                    if (window.lucide) lucide.createIcons();
                }, 2000);
            } catch (err) {
                console.error('Failed to copy: ', err);
            }
        }

        function renderSidebar() {
            const sidebar = document.getElementById('sidebar-nav');
            let html = '';
            for (const key in NAVIGATION) {
                const group = NAVIGATION[key];
                html += `
                    <div class="nav-group">
                        <div class="nav-group-header">${group.title}</div>
                        ${group.links.map(link => `
                            <a href="${link.path}" class="nav-link ${window.location.pathname === link.path ? 'active' : ''}" data-id="${link.id}">
                                ${link.label}
                            </a>
                        `).join('')}
                    </div>
                `;
            }
            sidebar.innerHTML = html;
            if (window.lucide) lucide.createIcons();

            syncActiveLink();
        }

        function syncActiveLink() {
            const currentPath = window.location.pathname;
            document.querySelectorAll('.nav-link').forEach(el => {
                const href = el.getAttribute('href');
                el.classList.toggle('active', href === currentPath);
            });
        }

        document.addEventListener('click', e => {
            const link = e.target.closest('a');
            const href = link?.getAttribute('href');
            if (link && href?.startsWith('/docs')) {
                if (link.target === '_blank' || e.metaKey || e.ctrlKey) return;
                e.preventDefault();
                window.location.href = href;
            }
        });

        document.getElementById('docs-search').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            document.querySelectorAll('.nav-link').forEach(link => {
                const text = link.textContent.toLowerCase();
                link.style.display = text.includes(query) ? 'flex' : 'none';
            });
            document.querySelectorAll('.nav-group').forEach(group => {
                const visible = group.querySelectorAll('.nav-link:not([style*="display: none"])');
                group.style.display = visible.length > 0 ? 'block' : 'none';
            });
        });

        document.addEventListener('DOMContentLoaded', () => {
            renderSidebar();
            document.querySelectorAll('pre code').forEach(block => {
                if (window.hljs) hljs.highlightElement(block);
            });
            if (window.lucide) lucide.createIcons();
        });
    </script>
</body>

</html>
